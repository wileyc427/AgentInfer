# The build, on machines that are not the one it was written on.
#
# A Roslyn generator is loaded into the compiler, so it is sensitive to the SDK
# patch version in a way ordinary code is not — a mismatch presents as "my
# generator produced nothing", with no error anywhere. TreatWarningsAsErrors,
# IsAotCompatible, EnableTrimAnalyzer and EnforceCodeStyleInBuild can each fire
# on a different SDK than a change was written against.
#
# Hence both platforms, both configurations, and samples run rather than only
# compiled.

name: build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# The build reads. The publish job below asks for `packages: write` on its own,
# so a compromised build step cannot push a package.
permissions:
  contents: read

# A superseded push is not worth a runner.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  # Deterministic restore. A CI run that resolves a different package version
  # from a local one is a difference nobody can see in a diff.
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

jobs:
  # Cheap, first, and catching something otherwise silent: the publish job skips
  # duplicates, so a change that does not raise <Version> publishes nothing and
  # still reports green, leaving consumers on the previous assembly.
  #
  # On pull requests too, so a missing bump stops at review rather than after
  # the merge.
  version:
    name: version
    if: "!startsWith(github.ref, 'refs/tags/')"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The guard diffs against the default branch, which a shallow clone
          # does not have. Without this it fails to resolve the base and exits 2
          # — loud, but for the wrong reason.
          fetch-depth: 0

      - name: A change to what ships must move the version
        run: |
          # On the default branch the question is what this push added to it, so
          # the base is where it was. Anywhere else the question is what the
          # branch adds, so the base is the default branch — comparing against
          # the previous push instead would let a branch pass by touching src in
          # one commit and nothing in the next.
          if [ "$GITHUB_REF" = "refs/heads/${{ github.event.repository.default_branch }}" ] \
             && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            base="${{ github.event.before }}"
          else
            base="origin/${{ github.event.repository.default_branch }}"
          fi

          .github/version-guard.sh "$base"

  build:
    name: ${{ matrix.os }} / ${{ matrix.configuration }}
    runs-on: ${{ matrix.os }}

    strategy:
      # Every cell reports. A Windows-only failure is the most likely kind here
      # and the least useful thing to have canceled by a Linux one.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        configuration: [Debug, Release]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The SDK builds both targets; the net8.0 runtime is what runs the net8.0
      # half of the test matrix. Without it those tests are compiled and skipped.
      - name: Install the SDK this repo pins, and the net8.0 runtime
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '8.0.x'
          global-json-file: global.json

      # Printed because the generator's behavior depends on it, and "which SDK
      # was that" is the first question every generator failure asks.
      - name: Report the toolchain
        run: dotnet --info

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ github.workspace }}/.nuget/packages
          key: nuget-${{ matrix.os }}-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ matrix.os }}-

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c ${{ matrix.configuration }} -warnaserror

      # Microsoft.Testing.Platform, not VSTest: the runner is selected in
      # global.json. The trx report is an MTP extension and its flag belongs to
      # the test executable rather than to the SDK, hence the separator. It
      # writes one file per assembly per framework, so nothing collides.
      - name: Test
        run: >-
          dotnet test --no-build -c ${{ matrix.configuration }}
          --results-directory ${{ github.workspace }}/test-results
          -- --report-trx

      # Smoke tests, not decoration. Against a scripted IChatClient they need no
      # endpoint and no key, and they exercise the generator, the tool loop, the
      # permission gate, enum binding and the scope counters end to end.
      #
      # Both, because they cover different halves: Incident runs a fully
      # generated agent, Intake a hand-written one over generated tools.
      - name: Run the incident sample
        run: dotnet run --project samples/Incident --no-build -c ${{ matrix.configuration }}

      - name: Run the intake sample
        run: dotnet run --project samples/Intake --no-build -c ${{ matrix.configuration }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: test-results-${{ matrix.os }}-${{ matrix.configuration }}
          path: ${{ github.workspace }}/test-results
          if-no-files-found: ignore

  pack:
    name: pack
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      # Separate from the matrix because packing fails differently from
      # compiling: an analyzer package has no lib/ assemblies, so pack-time
      # errors arrive on projects that built cleanly.
      - name: Pack
        run: dotnet pack -c Release -o ${{ github.workspace }}/artifacts

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: packages
          path: |
            ${{ github.workspace }}/artifacts/*.nupkg
            ${{ github.workspace }}/artifacts/*.snupkg

  publish:
    name: publish
    # Only from main, and only from this repository — a fork's push must not be
    # able to put a package under this owner's namespace.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && !github.event.repository.fork
    # `version` as well as `pack`: --skip-duplicate below makes a re-push of an
    # existing version a silent success, so the check that the version moved has
    # to be a gate rather than a note somebody reads afterwards.
    needs: [pack, version]
    runs-on: ubuntu-latest

    # Narrower than the workflow default, and the only job that widens it.
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: packages
          path: artifacts

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '10.0.x'

      # The artifact from `pack`, not a rebuild: a second compilation of the same
      # commit is not the bytes the matrix tested.
      #
      # Duplicates are skipped because <Version> only moves when somebody moves
      # it, so most pushes to main re-publish an existing version.
      - name: Push to GitHub Packages
        run: >-
          dotnet nuget push "artifacts/*.nupkg"
          --source https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json
          --api-key ${{ secrets.GITHUB_TOKEN }}
          --skip-duplicate
          --no-symbols

  release:
    name: release
    # A tag, from this repository only. nuget.org is permanent: a version pushed
    # there cannot be replaced, only delisted, so this must never run by accident.
    if: startsWith(github.ref, 'refs/tags/v') && !github.event.repository.fork
    needs: pack
    runs-on: ubuntu-latest

    # Set this environment up with a required reviewer. It is the one approval
    # gate between a tag and a permanent public artifact.
    environment: nuget.org

    # Trusted publishing: nuget.org trades a GitHub OIDC token for a key that
    # lives minutes, so there is no long-lived secret in this repository to leak
    # or rotate. id-token: write is what lets the runner request that token.
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The ancestry check below compares against main, which a shallow
          # clone of a tag does not have.
          fetch-depth: 0

      # Fail here, with the fix in the message, rather than at the exchange with
      # an error about an empty user.
      - name: The nuget.org account must be named
        run: |
          if [ -z "${{ vars.NUGET_USER }}" ]; then
            echo "Repository variable NUGET_USER is not set." >&2
            echo "Settings > Secrets and variables > Actions > Variables > New" >&2
            echo "repository variable, named NUGET_USER, set to the nuget.org" >&2
            echo "account that owns the trusted publishing policy." >&2
            exit 1
          fi

      # A tag that disagrees with <Version> publishes something nobody asked
      # for, under a number that does not match the release notes.
      - name: The tag must name the version being packed
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(grep -oP '(?<=<Version>)[^<]+' Directory.Build.props | head -1)
          if [ "$tag" != "$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match <Version> $version." >&2
            echo "Move one to agree with the other; do not publish the difference." >&2
            exit 1
          fi
          echo "Tag and version agree on $version."

      # A tag can point anywhere. Restricting who may create one is a different
      # question from what it may point at, and only this answers the second.
      #
      # main requires a pull request with passing checks, so "reachable from
      # main" transitively means reviewed and green. Without this, pushing a
      # branch and tagging it publishes to nuget.org having skipped both —
      # permanently, since a published version can only be delisted.
      #
      # Before the OIDC exchange, so no credential is minted for a tag that
      # should not publish. FETCH_HEAD rather than origin/main, because whether
      # a remote-tracking ref exists depends on how the checkout was configured;
      # the fetch on the line above always sets FETCH_HEAD.
      - name: The tag must point at a commit on main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD; then
            echo "Tag $GITHUB_REF_NAME points at $GITHUB_SHA, which is not on main." >&2
            echo "nuget.org is permanent, so only reviewed commits are publishable." >&2
            echo "Merge the change first, then tag the merge commit." >&2
            exit 1
          fi
          echo "$GITHUB_SHA is on main."

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: packages
          path: artifacts

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '10.0.x'

      # Exchanges the runner's OIDC token for a short-lived nuget.org key. The
      # policy on nuget.org decides whether to honour it, and it is scoped to
      # this repository and this workflow.
      - name: Exchange the OIDC token for a nuget.org key
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ vars.NUGET_USER }}

      # The same bytes the matrix tested and `pack` produced, symbols included.
      - name: Push to nuget.org
        run: >-
          dotnet nuget push "artifacts/*.nupkg"
          --source https://api.nuget.org/v3/index.json
          --api-key "${{ steps.login.outputs.NUGET_API_KEY }}"
          --skip-duplicate
