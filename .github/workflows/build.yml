# The build, on machines that are not the one it was written on.
#
# Two reasons this exists rather than "it builds here". A Roslyn generator is
# loaded into the compiler, so it is sensitive to the SDK patch version in a way
# ordinary code is not — "my generator produced nothing" is what a mismatch
# looks like, with no error anywhere. And the repo turns on
# TreatWarningsAsErrors, IsAotCompatible, EnableTrimAnalyzer and
# EnforceCodeStyleInBuild, every one of which can fire on a different SDK than
# the one a change was written against.
#
# So: both major platforms, Release as well as Debug, and the sample actually
# run rather than only compiled.

name: build

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

# The build reads. The publish job below asks for `packages: write` on its own,
# so a compromised build step cannot push a package.
permissions:
  contents: read

# A superseded push is not worth a runner.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  # Deterministic restore. A CI run that resolves a different package version
  # from a local one is a difference nobody can see in a diff.
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

jobs:
  # Cheap, and first, because the thing it catches is silent.
  #
  # `dotnet nuget push --skip-duplicate` in the publish job treats an
  # already-published version as success, so a change that does not raise
  # <Version> publishes nothing and reports green. Consumers keep restoring the
  # previous assembly, and the symptom arrives in their repository rather than
  # this one: a consumer restoring an AgentInfer that has never heard of a feature
  # sitting in this main.
  #
  # It runs on pull requests too, which is the point: a missing bump should stop
  # at review rather than turn main red after the merge.
  version:
    name: version
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          # The guard diffs against the default branch, which a shallow clone
          # does not have. Without this it fails to resolve the base and exits 2
          # — loud, but for the wrong reason.
          fetch-depth: 0

      - name: A change to what ships must move the version
        run: |
          # On the default branch the question is what this push added to it, so
          # the base is where it was. Anywhere else the question is what the
          # branch adds, so the base is the default branch — comparing against
          # the previous push instead would let a branch pass by touching src in
          # one commit and nothing in the next.
          if [ "$GITHUB_REF" = "refs/heads/${{ github.event.repository.default_branch }}" ] \
             && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            base="${{ github.event.before }}"
          else
            base="origin/${{ github.event.repository.default_branch }}"
          fi

          .github/version-guard.sh "$base"

  build:
    name: ${{ matrix.os }} / ${{ matrix.configuration }}
    runs-on: ${{ matrix.os }}

    strategy:
      # Every cell reports. A Windows-only failure is the most likely kind here
      # and the least useful thing to have canceled by a Linux one.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        configuration: [Debug, Release]

    steps:
      - uses: actions/checkout@v7

      - name: Install the SDK this repo pins
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # Printed because the generator's behavior depends on it, and "which SDK
      # was that" is the first question every generator failure asks.
      - name: Report the toolchain
        run: dotnet --info

      - uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.nuget/packages
          key: nuget-${{ matrix.os }}-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ matrix.os }}-

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c ${{ matrix.configuration }} -warnaserror

      - name: Test
        run: >-
          dotnet test --no-build -c ${{ matrix.configuration }}
          --logger "trx;LogFileName=test-results.trx"
          --results-directory ${{ github.workspace }}/test-results

      # The sample is a smoke test, not decoration. It runs against a scripted
      # IChatClient, so it needs no endpoint and no key — and it exercises the
      # generator, the tool loop, the permission gate, enum binding and the
      # scope counters end to end. Compiling it proves none of that.
      # Both scripted samples, because they exercise different halves: Incident
      # runs a fully generated agent, Intake runs a hand-written one over
      # generated tools. A change that breaks only the second is exactly the
      # kind the first would not notice.
      - name: Run the incident sample
        run: dotnet run --project samples/Incident --no-build -c ${{ matrix.configuration }}

      - name: Run the intake sample
        run: dotnet run --project samples/Intake --no-build -c ${{ matrix.configuration }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.os }}-${{ matrix.configuration }}
          path: ${{ github.workspace }}/test-results
          if-no-files-found: ignore

  pack:
    name: pack
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # Separate from the build matrix because packing fails differently from
      # compiling: an analyzer package has no lib/ assemblies, so the rules that
      # make a normal package well-formed do not apply to it, and the error
      # arrives at pack time on a project that built cleanly.
      - name: Pack
        run: dotnet pack -c Release -o ${{ github.workspace }}/artifacts

      - uses: actions/upload-artifact@v7
        with:
          name: packages
          path: ${{ github.workspace }}/artifacts/*.nupkg

  publish:
    name: publish
    # Only from main, and only from this repository — a fork's push must not be
    # able to put a package under this owner's namespace.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && !github.event.repository.fork
    # `version` as well as `pack`: --skip-duplicate below makes a re-push of an
    # existing version a silent success, so the check that the version moved has
    # to be a gate rather than a note somebody reads afterwards.
    needs: [pack, version]
    runs-on: ubuntu-latest

    # Narrower than the workflow default, and the only job that widens it.
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/download-artifact@v8
        with:
          name: packages
          path: artifacts

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # The artifact from `pack`, not a rebuild. Publishing a second compilation
      # of the same commit would mean the bytes somebody restores are not the
      # bytes the matrix above tested.
      #
      # --skip-duplicate because the version in Directory.Build.props only moves
      # when somebody changes it: every other push to main re-publishes a
      # version that already exists, and that is a 409 rather than a problem.
      - name: Push to GitHub Packages
        run: >-
          dotnet nuget push "artifacts/*.nupkg"
          --source https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json
          --api-key ${{ secrets.GITHUB_TOKEN }}
          --skip-duplicate
